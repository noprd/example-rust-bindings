[project]
name = 'example'
version = '0.0.0'
description = 'Example repository using example-package'
urls = {homepage='https://github.com/noprd/example-rust-bindings/demo/python'}
authors = [
    {name="noprd", email='noprd@users.noreply.github.com'},
]
maintainers = [
    {name="noprd", email='noprd@users.noreply.github.com'},
]
license = "MIT"
license-files = ["LICENCE"]
readme = 'README.md'
keywords = [
  "python",
  "packages",
  "rust",
]
# cf. https://pypi.org/classifiers
classifiers = [
    'Environment :: Console',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
requires-python = ">=3.10,<3.15"

[dependency-groups]
empty = []

base = [
    # --------------------------------
    # code - general
    # --------------------------------
    "pathlib>=1.0.1",
    "codetiming>=1.4.0",
    "safetywrap>=1.5.0",
    # --------------------------------
    # code - async, distr. system
    # --------------------------------
    # "asyncio>=4.0.0",
    # "lazy-load>=0.8.3",
    # --------------------------------
    # config
    # --------------------------------
    "toml>=0.10.2",
    "argparse>=1.4.0",
    "python-dotenv>=1.2.2",
    # --------------------------------
    # models
    # --------------------------------
    # "pydantic[email]>=2.13.1",
    # # --------------------------------
    # # miscellaneous
    # # --------------------------------
    "datetime>=6.0",
    "python-dateutil>=2.9.0.post0",
    "tzdata>=2026.1", # NOTE: necessary to ensure that OS has access to timezones, otherwise polars throws error
    "pytz>=2026.1",
    "flatdict>=4.1.0",
    "strip-ansi>=0.1.1",
    "lorem-text>=3.0",
    # --------------------------------
    # web + API
    # --------------------------------
    "certifi>=2026.2.25",
    "httpx>=0.28.1",
]

first-party = [
    # builds package from source code - requires local machine to have rust/cargo
    # "example-package @ git+https://${GIT_PAT}@github.com/noprd/example-package.git@v0.0.0#egg=example-package",
    # loads package from appropriate binary - requires download (automatic or manual) of all .whl files in advance
    "example-package @ file://${PWD}/dist/example_package-${GIT_TAG_SHORT}-cp314-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "example-package @ file://${PWD}/dist/example_package-${GIT_TAG_SHORT}-cp314-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.14'",
    "example-package @ file://${PWD}/dist/example_package-${GIT_TAG_SHORT}-cp314-abi3-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.14'",
    "example-package @ file://${PWD}/dist/example_package-${GIT_TAG_SHORT}-cp314-abi3-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'amd64' and python_version == '3.14'",
    # e.g. for python v3.11
    # "example-package @ file://${PWD}/dist/example_package-${GIT_TAG_SHORT}-cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
    # "example-package @ file://${PWD}/dist/example_package-${GIT_TAG_SHORT}-cp311-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.11'",
    # "example-package @ file://${PWD}/dist/example_package-${GIT_TAG_SHORT}-cp311-abi3-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.11'",
    # "example-package @ file://${PWD}/dist/example_package-${GIT_TAG_SHORT}-cp311-abi3-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'amd64' and python_version == '3.11'",
]

dev = [
    # --------------------------------
    # package management, linting, hooks
    # --------------------------------
    "uv>=0.11.7",
    "ruff>=0.15.10",
    # "pre-commit>=4.5.1",
    # --------------------------------
    # testing
    # --------------------------------
    "pytest>=9.0.3",
    "coverage[toml]>=7.13.5",
    "pytest-cov>=7.1.0",
    "pytest-order>=1.3.0",
    # "testfixtures>=11.0.0",
    "behave>=1.3.3",
    # "faker>=40.13.0",
    "mimesis[factory]>=19.1.0",
    # --------------------------------
    # models
    # --------------------------------
    "datamodel-code-generator[ruff]>=0.56.0",
    # "openapi-generator-cli>=7.21.0",
    # "openapi-generator>=1.0.6",
    "maturin>=1.13.1",
    # --------------------------------
    # miscellaneous
    # --------------------------------
    "croniter>=6.2.2",
    "memory-profiler>=0.61.0",
]

[build-system]
requires = [
  "setuptools>=82.0.1",
  "wheel>=0.46.3",
  "maturin>=1.8.3,<2.0",
]
build-backend = "setuptools.build_meta"

[tool.pip]
extra-index-url = []

[tool.uv]
managed = true
package = false
default-groups = ["dev"]
required-environments = []

[tool.uv.workspace]
members = []

# cf. https://docs.astral.sh/ruff/configuration
# and https://docs.astral.sh/ruff/settings
[tool.ruff]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]
exclude = ["src/**/models/generated/**/*.py"]
respect-gitignore = true
line-length = 96
indent-width = 4
target-version = "py314"
fix = true

[tool.ruff.lint]
fixable = ["ALL"]
select = ["D", "E", "F", "I", "RUF"]
ignore = [
    "ARG001", # allow unused arguments
    "BLE001", # allow blind exceptions
    "D100", # do not require docstring for module
    "D101", # do not require docstring for module
    "D102", # do not require docstring
    "D103", # do not require docstring
    "D104", # do not require docstring
    "D105", # do not require docstring
    "D106", # do not require docstring
    "D107", # do not require docstring
    "D200", # prevent docstrings from being forced to fit one-line
    "D203",
    "D205", # do not require blank line between summary and description in docstring
    "D211",
    "D212", # prevent first newline from being removed in docstrings
    "D400", # prevent grammatical constraints (full stop)
    "D401", # prevent grammatical constraints (imperative mood)
    "D403", # prevent case changes in Docstrings.
    "D404", # allow freedom of expression in docstrings
    "D405", # allow non-capitalised-section-name
    "D413", # allow missing-blank-line-after-last-section
    "D415", # do not require punctuation in docstring
    "EXE001", # allow unused shebangs
    "E402", # allow module level import to be not at top of file
    "E501", # ignore "line too long" errors in case "fmt: skip" pragma is used
    # "E703",
    "E712", # turn off, as sometimes variables have mixed boolean + string/null types
    "E731", # allow lambda expressions
    "F403", # disable as conflicts with *-imports
    "F405", # disable as conflicts with *-imports
    # "F541", # allow f-string without placeholders
    "F841", # unused variables - need to switch off e.g. for decorators
    "F811", # allow redefinition of methods
    # "I100", # disable imports from same library being forced into a single ,-separated statement
    # "I102", # disable multiple import formatting
    "RUF001", # allow utf8 in comments
    "RUF003", # allow NO-BREAK SPACE in comments
    "RUF018", # allow assignment expressions in asserts
    "RUF028", # allow suppression comments within parts
    "S110", # allow try-except-pass
    "TID252", # allow relative imports from parent modules
    "UP009", # allow utf-8 shebangs
]

[tool.ruff.lint.isort]
relative-imports-order = "furthest-to-closest"
no-sections = false
from-first = false
combine-as-imports = false
case-sensitive = true
force-single-line = true
# known-local-folder = ["src", "tests"]
known-first-party = ["src", "tests"]
forced-separate = [
    "tests",
    "src._core",
    "src.setup",
    "src.models",
    "src",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false # false = allow trailing comma
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "9.0.2"
testpaths = [
    "tests",
]
python_files = [
    "**/tests_*.py",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "binary: tests that require the operating system to handle binaries correctly",
    "remote: tests that require credentials and for connection to remote services in order to run",
]
# NOTE: appends (not prepends) flags:
addopts = [
    "--order-dependencies",
    "--order-group-scope=module",
    "--cache-clear",
    "--verbose",
    "--maxfail=1",
    "-k test_", # <- pattern for methods to count as tests
    "-k tests_", # <- pattern for methods to count as tests
    # NOTE: will be ignored, if --cov not used (e.g. integration tests):
    "--no-cov-on-fail",
    "--cov-report=term",
    "--cov-config=.coveragerc",
    # NOTE: for development purposes only:
    # "-s", # verbose print/err capturing disabled
    "--capture=tee-sys", # verbose print/err capturing enabled
    "-m",
    "not (binary or remote)",
]
