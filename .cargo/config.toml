[env]
CC = "zig cc"
CXX = "zig c++"

[target.'cfg(all())']
rustflags = [
]

[target.'cfg(unix)']
rustflags = [
    "-A", "unused_imports",
    "-A", "dead_code",
]

[target.'cfg(target_os = "macos")']
# linker = "zig cc"
rustflags = [
    "-A", "unused_imports",
    "-A", "dead_code",
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]

[target.'cfg(windows)']
rustflags = [
    "-A", "unused_imports",
    "-A", "dead_code",
]
